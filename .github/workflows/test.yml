name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (requires-python) and newest
        python-version: ['3.10', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # setuptools_scm reads the version from git history when the package is built
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      # Catches a lockfile that is out of date with pyproject.toml or corrupted by a bad merge
      - name: Check lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run --no-sync pytest
